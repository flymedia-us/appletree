name: AppleTree
options:
  bundleIdPrefix: com.samfriedman
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  AppleTreeCore:
    path: Packages/AppleTreeCore
  AppleTreeUI:
    path: Packages/AppleTreeUI

targets:
  AppleTree:
    type: application
    platform: macOS
    sources:
      - path: AppleTree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samfriedman.AppleTree
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sam Friedman"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_ENTITLEMENTS: AppleTree/AppleTree.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: AppleTreeCore
      - package: AppleTreeUI

schemes:
  AppleTree:
    build:
      targets:
        AppleTree: all
    run:
      config: Debug
    test:
      config: Debug
