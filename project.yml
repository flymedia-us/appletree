name: AppleTree
options:
  bundleIdPrefix: com.FlyMedia
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  AppleTreeCore:
    path: Packages/AppleTreeCore
  AppleTreeUI:
    path: Packages/AppleTreeUI

targets:
  AppleTree:
    type: application
    platform: macOS
    sources:
      - path: AppleTree
        excludes:
          - PrivacyInfo.xcprivacy
      - path: AppleTree/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.FlyMedia.AppleTree
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Fly Media LLC"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Without an explicit display name the menu bar and Finder fall back to
        # CFBundleName, which GENERATE_INFOPLIST_FILE derives from the target
        # name — keep both spelled the same as the UI strings and the About panel.
        INFOPLIST_KEY_CFBundleDisplayName: AppleTree
        # AppleTree makes no network connections and uses no encryption beyond
        # what macOS itself provides. Declaring this here answers App Store
        # Connect's export-compliance question at upload time instead of
        # stalling every single build on the manual questionnaire.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # A broader home-folder or volume selection is not implied consent for
        # these nested TCC-protected folders. Keep the prompt explanations even
        # without folder-specific sandbox entitlements: the Open Panel security
        # scope handles App Sandbox access, while these strings explain the
        # separate Files & Folders privacy prompts.
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "AppleTree reads your Desktop folder when it is included in a folder or volume you choose to scan."
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: "AppleTree reads your Documents folder when it is included in a folder or volume you choose to scan."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "AppleTree reads your Downloads folder when it is included in a folder or volume you choose to scan."
        CODE_SIGN_ENTITLEMENTS: AppleTree/AppleTree.entitlements
        CODE_SIGN_STYLE: Automatic
        # Must live here, not only in the generated pbxproj: `xcodegen generate`
        # rewrites the project from this file, so a team set by hand in Xcode
        # is silently dropped the next time anyone regenerates.
        DEVELOPMENT_TEAM: BJZSH247Q9
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: AppleTreeCore
      - package: AppleTreeUI

schemes:
  AppleTree:
    build:
      targets:
        AppleTree: all
    run:
      config: Debug
    test:
      config: Debug
