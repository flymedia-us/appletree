name: AppleTree
options:
  bundleIdPrefix: com.samfriedman
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  AppleTreeCore:
    path: Packages/AppleTreeCore
  AppleTreeUI:
    path: Packages/AppleTreeUI

targets:
  AppleTree:
    type: application
    platform: macOS
    sources:
      - path: AppleTree
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samfriedman.AppleTree
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Sam Friedman"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Required alongside the matching sandbox entitlements in
        # AppleTree.entitlements — without these, macOS denies (or, for
        # Photos, crashes on) the access with no explanation shown to the
        # user. See com.apple.security.personal-information.photos-library
        # and com.apple.security.files.downloads.read-only.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Apple Tree reads your Photos Library so a scan of your Pictures folder or whole disk can include its size."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "Apple Tree reads your Downloads folder so a scan can include its size."
        CODE_SIGN_ENTITLEMENTS: AppleTree/AppleTree.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: AppleTreeCore
      - package: AppleTreeUI

schemes:
  AppleTree:
    build:
      targets:
        AppleTree: all
    run:
      config: Debug
    test:
      config: Debug
