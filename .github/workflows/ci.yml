name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Swift package tests
    # macos-26's default Xcode is 26.x (Swift 6.2+); the packages declare
    # swift-tools-version 6.2, which macos-15's Swift 6.1 can't parse.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test AppleTreeCore
        working-directory: Packages/AppleTreeCore
        run: swift test

      - name: Test AppleTreeUI
        working-directory: Packages/AppleTreeUI
        run: swift test

      - name: Test app scan lifecycle
        run: |
          xcodebuild \
            -project AppleTree.xcodeproj \
            -scheme AppleTree \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AppTests" \
            CODE_SIGNING_ALLOWED=NO \
            test

  build:
    name: App target (Release)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The package suites above never compile AppleTree/ itself, so without
      # this the whole SwiftUI shell (AppState, ContentView, the AppKit
      # representable wiring) can break without CI noticing. Signing is off:
      # this job proves it compiles, not that it's distributable.
      - name: Build app target
        run: |
          xcodebuild \
            -project AppleTree.xcodeproj \
            -scheme AppleTree \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            build

      # Unsigned on purpose: this only checks that the drag-and-drop DMG
      # script still produces an image. Shipping builds are signed and
      # notarized by .github/workflows/release.yml on a version tag.
      - name: Package unsigned DMG
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData" -path '*/Build/Products/Release/AppleTree.app' -type d | head -n 1)
          if [[ -z "$APP" ]]; then
            echo "error: Release AppleTree.app not found under DerivedData" >&2
            find "$RUNNER_TEMP/DerivedData" -name 'AppleTree.app' >&2 || true
            exit 1
          fi
          scripts/package-dmg.sh "$APP" dist/AppleTree-ci-unsigned.dmg

      - name: Upload unsigned DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppleTree-ci-unsigned-dmg
          path: dist/AppleTree-ci-unsigned.dmg
          if-no-files-found: error

  compatibility:
    name: macOS 15 (Intel)
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      # This image defaults to Swift 6.1; explicitly use the installed 6.2+
      # toolchain while running the binaries on the oldest supported macOS.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runtime and toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Test packages on macOS 15 Intel
        run: |
          swift test --package-path Packages/AppleTreeCore
          swift test --package-path Packages/AppleTreeUI
      - name: Test app on macOS 15 Intel
        run: |
          xcodebuild \
            -project AppleTree.xcodeproj \
            -scheme AppleTree \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath "$RUNNER_TEMP/AppTests" \
            CODE_SIGNING_ALLOWED=NO \
            test
