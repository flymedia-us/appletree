name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Swift package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Test AppleTreeCore
        working-directory: Packages/AppleTreeCore
        run: swift test

      - name: Test AppleTreeUI
        working-directory: Packages/AppleTreeUI
        run: swift test
