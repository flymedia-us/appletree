name: App Store preparation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect state, or upload a build without submitting for review
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - upload

permissions:
  contents: read
  checks: read

concurrency:
  group: app-store-preparation
  cancel-in-progress: false

jobs:
  snapshot:
    name: Inspect App Store release state
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Inspect AppleTree metadata and builds
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python3 scripts/app-store-connect.py snapshot --output "$RUNNER_TEMP/app-store-state.json"
      - name: Save metadata snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-store-state
          path: ${{ runner.temp }}/app-store-state.json
          retention-days: 3
          if-no-files-found: error

  upload:
    name: Upload App Store build without submission
    if: github.ref == 'refs/heads/main' && inputs.operation == 'upload'
    needs: snapshot
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require passing CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          python3 - "$RUNNER_TEMP/checks.json" <<'PY'
          import json, sys
          checks = json.load(open(sys.argv[1]))['check_runs']
          for name in ['Swift package tests', 'App target (Release)', 'macOS 15 (Intel)']:
              check = next((item for item in checks if item['name'] == name), None)
              if not check or check['conclusion'] != 'success' or check['app']['id'] != 15368:
                  raise SystemExit(f'Required CI check is not successful: {name}')
          print('All required CI checks passed for this commit.')
          PY
      - name: Import App Store distribution identities
        id: certs
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APP_STORE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APP_STORE_DISTRIBUTION_P12_PASSWORD }}
      - name: Authorize signing and install provisioning profile
        env:
          KEYCHAIN_PASSWORD: ${{ steps.certs.outputs.keychain-password }}
          PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-keychain-settings -lut 21600 signing_temp.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" signing_temp.keychain
          python3 - <<'PYPROFILE'
          import base64, os, pathlib, plistlib, subprocess
          profile = pathlib.Path(os.environ['RUNNER_TEMP']) / 'AppleTree.provisionprofile'
          profile.write_bytes(base64.b64decode(os.environ['PROFILE_BASE64']))
          profile.chmod(0o600)
          decoded = subprocess.check_output(['security', 'cms', '-D', '-i', str(profile)])
          metadata = plistlib.loads(decoded)
          assert metadata['TeamIdentifier'] == ['BJZSH247Q9']
          assert metadata['Entitlements']['com.apple.application-identifier'] == 'BJZSH247Q9.com.FlyMedia.AppleTree'
          directory = pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          directory.mkdir(parents=True, exist_ok=True)
          destination = directory / (metadata['UUID'] + '.provisionprofile')
          destination.write_bytes(profile.read_bytes())
          destination.chmod(0o600)
          print('Installed App Store profile:', metadata['Name'])
          PYPROFILE
      - name: Archive signed universal app
        env:
          APP_CERTIFICATE: ${{ vars.APP_STORE_APP_CERTIFICATE_SHA1 }}
        run: |
          xcodebuild \
            -project AppleTree.xcodeproj \
            -scheme AppleTree \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/AppleTree.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APP_CERTIFICATE" DEVELOPMENT_TEAM=BJZSH247Q9 \
            PROVISIONING_PROFILE_SPECIFIER="AppleTree Mac App Store 2026" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            archive
      - name: Verify archive signature and sandbox
        run: |
          APP="$RUNNER_TEMP/AppleTree.xcarchive/Products/Applications/AppleTree.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 - "$APP" <<'PYCHECK'
          import plistlib, subprocess, sys
          result = subprocess.run(['codesign', '-d', '--entitlements', '-', sys.argv[1]],
                                  capture_output=True, check=True)
          entitlements = plistlib.loads(result.stdout)
          assert entitlements.get('com.apple.security.app-sandbox') is True
          assert entitlements.get('com.apple.security.files.user-selected.read-write') is True
          assert not entitlements.get('com.apple.security.get-task-allow', False)
          print('Signed archive has App Sandbox and user-selected read/write access.')
          PYCHECK
      - name: Sign and upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_CERTIFICATE: ${{ vars.APP_STORE_APP_CERTIFICATE_SHA1 }}
          INSTALLER_CERTIFICATE: ${{ vars.APP_STORE_INSTALLER_CERTIFICATE_SHA1 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          (umask 077; printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY")
          trap 'rm -f "$KEY"' EXIT
          python3 - "$RUNNER_TEMP/AppStoreExport.plist" <<'PY'
          import os, plistlib, sys
          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'manual',
              'signingCertificate': os.environ['APP_CERTIFICATE'],
              'installerSigningCertificate': os.environ['INSTALLER_CERTIFICATE'],
              'provisioningProfiles': {'com.FlyMedia.AppleTree': 'AppleTree Mac App Store 2026'},
              'teamID': 'BJZSH247Q9',
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
              'stripSwiftSymbols': True,
          }
          with open(sys.argv[1], 'wb') as output:
              plistlib.dump(options, output)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AppleTree.xcarchive" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "$RUNNER_TEMP/AppStoreExport.plist" \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          # This uploads only. Review submission and release are never invoked.
