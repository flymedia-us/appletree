name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  dmg:
    name: Signed notarized DMG
    runs-on: macos-26
    needs: checks
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify release source and version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)"/\1/p' project.yml)
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

      - name: Require signing secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          missing=0
          for name in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD \
            APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Add the secrets listed in docs/releasing.md, then re-run."
            exit 1
          fi

      - name: Import Developer ID certificate
        id: certs
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      # xcodebuild archive + Developer ID + -allowProvisioningUpdates hangs
      # on these runners (keychain ACL / portal). Unlock the temp keychain,
      # allow Xcode's codesign to use the key without a GUI prompt, and
      # refuse to continue if the p12 is not Developer ID Application.
      - name: Authorize Developer ID for codesign
        env:
          KEYCHAIN_PASSWORD: ${{ steps.certs.outputs.keychain-password }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-keychain-settings -lut 21600 signing_temp.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q 'Developer ID Application'; then
            echo "::error::DEVELOPER_ID_P12_BASE64 is not a Developer ID Application certificate."
            exit 1
          fi

      - name: Sign, notarize, and wrap DMG
        timeout-minutes: 45
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: scripts/package-release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppleTree-dmg
          path: |
            dist/AppleTree-*.dmg
            dist/AppleTree-*.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/AppleTree-*.dmg
            dist/AppleTree-*.dmg.sha256
            LICENSE
          body: |
            Direct-download build of AppleTree — the same app as the Mac App Store listing, signed with Developer ID and notarized.

            **Install:** open the DMG and drag AppleTree into Applications.

            This build does not auto-update. Mac App Store purchases update through the store.

            Source and license: GPLv3. The license text is also inside the app bundle at `AppleTree.app/Contents/Resources/LICENSE`.
